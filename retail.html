<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retail · The Walvis Promenade | Walvis Concierge</title>
  <meta name="description" content="The Walvis Promenade: hypercars, private jets, superyachts, haute horlogerie, high jewellery, fine art and Bangladeshi heritage, sourced on request by Walvis Concierge.">
  <link rel="canonical" href="retail/index.html">
  <meta http-equiv="refresh" content="0; url=retail/index.html">
  <style>html, body { margin: 0; background: #12040f; color: #fffafa; font-family: Georgia, serif; } p { padding: 40px; }</style>
  <!-- The Retail page lives in its own folder now: retail/ (The Walvis Promenade).
       Old addresses (retail.html#/level/…, #/shop/…, #/item/…) are sent to the matching page. -->
  <script>
    (function () {
      var m = location.hash.match(/^#\/(level|shop|item)\/([\w-]+)/), to = 'retail/index.html';
      if (m) to = 'retail/' + m[1] + '.html?' + m[1] + '=' + encodeURIComponent(m[2]);
      location.replace(to);
    })();
  </script>
</head>
<body><p><a href="retail/index.html" style="color:#5cc4c0">Enter The Walvis Promenade</a></p></body>
</html>
